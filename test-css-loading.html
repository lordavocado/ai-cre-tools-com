<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Loading Test</title>
  
  <!-- Critical inline styles for immediate rendering -->
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 0 0% 9%;
      --primary: 0 0% 9%;
      --primary-foreground: 0 0% 98%;
      --secondary: 0 0% 96%;
      --secondary-foreground: 0 0% 9%;
      --muted: 0 0% 96%;
      --muted-foreground: 0 0% 45%;
      --border: 0 0% 90%;
      --ring: 0 0% 9%;
      --radius: 0.5rem;
    }
    * { box-sizing: border-box; }
    html { height: 100%; scroll-behavior: smooth; }
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      line-height: 1.6; 
      color: hsl(0 0% 9%); 
      background-color: hsl(0 0% 100%);
      min-height: 100vh;
      font-feature-settings: "rlig" 1, "calt" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .min-h-screen { min-height: 100vh; }
    .p-8 { padding: 2rem; }
    .text-center { text-align: center; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .font-bold { font-weight: 700; }
    .text-green-600 { color: #059669; }
    .text-blue-600 { color: #2563eb; }
    .mt-4 { margin-top: 1rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-radius: calc(var(--radius) - 2px);
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid hsl(var(--border));
      background-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      cursor: pointer;
      margin: 0.5rem;
    }
    .btn:hover {
      background-color: hsl(var(--primary) / 0.9);
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .status-success { background-color: #059669; }
    .status-loading { background-color: #f59e0b; animation: pulse 1s infinite; }
    .status-error { background-color: #dc2626; }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
  
  <!-- Test CSS loading with intentionally broken link -->
  <link rel="stylesheet" href="/nonexistent-styles.css" id="test-broken-css">
  
  <script>
    (function() {
      function updateStatus(id, status, message) {
        const element = document.getElementById(id);
        if (element) {
          element.innerHTML = `<span class="status-indicator status-${status}"></span>${message}`;
        }
      }
      
      function checkCSSLoaded() {
        const testEl = document.createElement('div');
        testEl.className = 'flex';
        document.body.appendChild(testEl);
        const isLoaded = window.getComputedStyle(testEl).display === 'flex';
        document.body.removeChild(testEl);
        
        if (isLoaded) {
          document.documentElement.classList.add('css-loaded');
          updateStatus('critical-css-status', 'success', 'Critical CSS: Loaded');
          return true;
        } else {
          updateStatus('critical-css-status', 'loading', 'Critical CSS: Loading...');
          return false;
        }
      }
      
      function testCSS() {
        updateStatus('critical-css-status', 'loading', 'Critical CSS: Testing...');
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkCSSLoaded);
        } else {
          checkCSSLoaded();
        }
        
        // Test broken CSS handling
        const brokenLink = document.getElementById('test-broken-css');
        if (brokenLink) {
          updateStatus('broken-css-status', 'loading', 'Broken CSS: Testing...');
          
          brokenLink.onerror = function() {
            updateStatus('broken-css-status', 'success', 'Broken CSS: Error handled correctly');
          };
          
          brokenLink.onload = function() {
            updateStatus('broken-css-status', 'error', 'Broken CSS: Unexpectedly loaded?');
          };
          
          setTimeout(() => {
            const currentStatus = document.getElementById('broken-css-status').textContent;
            if (currentStatus.includes('Testing')) {
              updateStatus('broken-css-status', 'success', 'Broken CSS: No error event (but handled)');
            }
          }, 2000);
        }
      }
      
      testCSS();
    })();
  </script>
</head>
<body>
  <div class="flex flex-col items-center justify-center min-h-screen p-8">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-blue-600">CSS Loading Test</h1>
      <p class="text-lg mt-4">Testing robust CSS loading and fallback mechanisms</p>
      
      <div class="mt-4">
        <div id="critical-css-status" class="text-lg">
          <span class="status-indicator status-loading"></span>Critical CSS: Initializing...
        </div>
        <div id="broken-css-status" class="text-lg mt-4">
          <span class="status-indicator status-loading"></span>Broken CSS: Initializing...
        </div>
      </div>
      
      <div class="mt-4">
        <button class="btn" onclick="location.reload()">Reload Test</button>
        <button class="btn" onclick="window.close()">Close</button>
      </div>
    </div>
  </div>
</body>
</html>
