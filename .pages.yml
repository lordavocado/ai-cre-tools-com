# Pages CMS Configuration
# This file configures Pages CMS for managing the Guides section

# Media configuration for guide images and assets
media:
  input: public/images
  output: /images

# Content configuration for guides
content:
  - name: guides
    label: Guides
    folder: src/content/guides
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    fields:
      - name: id
        label: ID
        widget: string
        required: true
        hint: "Unique identifier for the guide (used internally)"
      
      - name: slug
        label: URL Slug
        widget: string
        required: true
        pattern: ["^[a-z0-9-]+$", "Must be lowercase letters, numbers, and hyphens only"]
        hint: "URL-friendly version (e.g., 'getting-started-with-analytics')"
      
      - name: title
        label: Title
        widget: string
        required: true
        hint: "The main title of the guide"
      
      - name: excerpt
        label: Excerpt
        widget: text
        required: true
        hint: "Short description for previews and SEO (150-200 characters recommended)"
      
      - name: category
        label: Category
        widget: select
        required: false
        options:
          - { label: "Analytics", value: "analytics" }
          - { label: "Getting Started", value: "getting-started" }
          - { label: "Advanced", value: "advanced" }
          - { label: "Tools", value: "tools" }
          - { label: "Best Practices", value: "best-practices" }
          - { label: "Tutorials", value: "tutorials" }
        hint: "Category for organizing guides"
      
      - name: publishedDate
        label: Published Date
        widget: datetime
        required: true
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "When this guide was published"
      
      - name: author
        label: Author
        widget: string
        required: false
        default: "Analytics Team"
        hint: "Author name"
      
      - name: readingTime
        label: Reading Time
        widget: string
        required: false
        pattern: ["^\\d+\\s+(min|mins|minute|minutes)\\s+read$", "Format: '5 min read' or '10 minutes read'"]
        hint: "Estimated reading time (e.g., '5 min read')"
      
      - name: imageUrl
        label: Featured Image
        widget: image
        required: false
        media_folder: "/images/guides"
        public_folder: "/images/guides"
        hint: "Main image for the guide (recommended: 1200x630px)"
      
      - name: relatedItems
        label: Related Items
        widget: list
        required: false
        field: 
          label: Item Slug
          name: slug
          widget: string
        hint: "List of related tool/item slugs that will be shown at the bottom of the guide"
      
      - name: body
        label: Content
        widget: markdown
        required: true
        hint: "Main content of the guide in Markdown format"

    # View configuration for the guides collection
    view:
      fields: [ title, publishedDate, category, author ]
      sort: [ publishedDate ]
      default:
        sort: publishedDate
        sortDirection: desc 