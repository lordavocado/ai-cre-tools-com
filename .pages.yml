# Pages CMS Configuration
# This file configures Pages CMS for managing the Guides section

# Media configuration for guide images and assets
media:
  input: public/images
  output: /images

# Content configuration for guides
content:
  - name: guides
    label: Guides
    folder: src/content/guides
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    fields:
      - name: id
        label: ID
        type: string
        required: true
      
      - name: slug
        label: URL Slug
        type: string
        required: true
      
      - name: title
        label: Title
        type: string
        required: true
      
      - name: excerpt
        label: Excerpt
        type: text
        required: true
      
      - name: category
        label: Category
        type: select
        required: false
        options:
          - { label: "Analytics", value: "analytics" }
          - { label: "Getting Started", value: "getting-started" }
          - { label: "Advanced", value: "advanced" }
          - { label: "Tools", value: "tools" }
          - { label: "Best Practices", value: "best-practices" }
          - { label: "Tutorials", value: "tutorials" }
      
      - name: publishedDate
        label: Published Date
        type: date
        required: true
      
      - name: author
        label: Author
        type: string
        required: false
        default: "Analytics Team"
      
      - name: readingTime
        label: Reading Time
        type: string
        required: false
      
      - name: imageUrl
        label: Featured Image
        type: image
        required: false
      
      - name: relatedItems
        label: Related Items
        type: string
        list: true
        required: false
      
      - name: body
        label: Content
        type: rich-text
        required: true

    # View configuration for the guides collection
    view:
      fields: [ title, publishedDate, category, author ]
      sort: [ publishedDate ]
      default:
        sort: publishedDate
        order: desc 